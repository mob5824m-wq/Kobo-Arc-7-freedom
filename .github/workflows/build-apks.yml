name: Build, Verify & Release Kobo Arc 7 Freedom v2.1.0

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru cryptography

      - name: Generate reskinned icons, fetch & verify official VLC ARMv7 APK, compile native binaries & sign all v2.1.0 APKs
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh releases/Start-Chromebook-Wired-Internet.sh tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          rm -f app/src/main/assets/starter-apps/VLC.apk releases/VLC.apk
          ./scripts/build-all.sh

      - name: Run full v2.1.0 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v2.1.0 APKs, bundled VLC.apk & Chromebook USB launcher back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch docs releases/Upgrade-My-Kobo-To-v1.9.0.apk releases/Upgrade-My-Kobo-To-v1.9.1.apk releases/Upgrade-My-Kobo-To-v2.0.0.apk
          git add \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v2.1.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/VLC.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Start-Chromebook-Wired-Internet.sh \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk \
            app/src/main/assets/chromebook/Start-Chromebook-Wired-Internet.sh
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v2.1.0 APKs, Customizable App Bar Launcher v51 & tools [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v2.1.0 APKs, VLC Media Player, Aurora Store, F-Droid, Upgrader & USB/Wi-Fi tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-v2.1.0-apks
          path: |
            releases/Upgrade-My-Kobo-To-v2.1.0.apk
            releases/KoboArc7Freedom.apk
            releases/VLC.apk
            releases/AuroraStore.apk
            releases/FDroidClassicLegacy.apk
            releases/VanillaAndroid4Home.apk
            releases/Start-Chromebook-Wired-Internet.sh
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Publish signed v2.1.0 APKs, VLC Media Player & Chromebook USB tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v2.1.0 (`ca.arc7freedom.app` v210 + Launcher `v51` + `Upgrade-My-Kobo-To-v2.1.0.apk`)

          ### New in `v2.1.0` — Full System-Wide Customizable App Bar (`Home Dock, Side Rails, Top Bar & In-App Bars`):
          - **Customizable Home App Bar Slots (0 to 12 Apps with Smooth Overflow Scrolling):**
            - Freely **pin any built-in or installed Android app** (or remove, replace, or reorder with 1 tap) via:
              - Tapping **`App Bar`** on the Home top bar or inside **`Kobo Arc 7 Freedom`**,
              - **Long-pressing any icon** on the Home App Bar (`Move Earlier`, `Move Later`, `Replace Slot`, `Add Another App`, `Remove from App Bar`, `Open Full App Bar Studio`),
              - **Long-pressing any app in the All-Apps Drawer (`:::`)** -> **`Pin to App Bar` / `Unpin from App Bar`**, or
              - **Long-pressing the App Bar bar background or any In-App header**.
          - **5 Home App Bar Positions (`Bottom`, `Top`, `Left Side Rail`, `Right Side Rail`, `Hidden`):**
            - Switch dynamically between classic **Bottom Dock**, **Top App Bar**, **Left Side Rail** (ideal for landscape 1280x800!), **Right Side Rail**, or **Hidden** (with full-desktop swipe-up gesture to open All Apps + `⚙ App Bar` button right inside the All-Apps header!).
          - **Full Visual Chrome, Sizing, Labels & Opacity Controls:**
            - Choose from **5 App Bar Styles** (*Floating Glass Pill*, *Full-Width Edge-to-Edge Bar*, *Minimal Transparent Icons*, *Solid Matte Slate Bar*, *Glowing Neon Accent Rim*), **4 Icon Sizes** (`34 dp` Compact, `42 dp` Standard, `50 dp` Large, `58 dp` Extra-Large), **4 All-Apps (`:::`) Button Placements** (*Center*, *Start*, *End*, *Hidden*), **Show/Hide App Labels**, **6 Glass Opacity Levels** (`0%`–`96%`), **7 Custom Accent Highlight Swatches**, and granular **Home Top Bar element toggles** (`Clock`, `Search`, `App Bar`, `Skin`, `Wallpaper`, or `Hidden`).
          - **Customizable In-App Top App Bars Across Every Built-In `Arc7` App:**
            - Configure **Compact / Standard / Tall App Bar height**, **OS Gradient / Flat Solid / Tinted Accent / Minimal Neon-Underline header chrome**, **Centered vs Left-Aligned app titles**, and a built-in **`Apps ▾` Quick App Bar Switcher** pill inside every app!
          - **Includes 100% of `v2.0.0` Features Intact:**
            - Two-way **Chromebook <-> Kobo Wired USB Internet**, pre-bundled official ARMv7 **`VLC.apk`**, **`Arc7 Calendar` + Home Widget**, **`Arc7 Photos` + Filter Studio**, **`Arc7 Camera` + Screen Flash**, **`Arc7 Calculator`**, **`Arc7 Notes & Sketchpad`**, **`Arc7 Files`**, **20 `archive.org` Alarm Chimes**, **Custom `Arc7 APK Installer`**, **5 OS Skins + 28 Reskinned High-DPI Icons**, **`Aurora Store v4.8.5`**, **`F-Droid v1302`**, **`python3` + `apt`**, and **TLS 1.3**.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v2.1.0 >/dev/null 2>&1; then
            gh release edit v2.1.0 --latest --title "Kobo Arc 7 Freedom v2.1.0 — Customizable App Bar + Custom OS Skin, VLC, Photos, Camera, Calendar & Chromebook USB Internet" --notes-file /tmp/release-notes.md
            gh release upload v2.1.0 \
              releases/Upgrade-My-Kobo-To-v2.1.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v2.1.0 \
              releases/Upgrade-My-Kobo-To-v2.1.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v2.1.0 — Customizable App Bar + Custom OS Skin, VLC, Photos, Camera, Calendar & Chromebook USB Internet" \
              --notes-file /tmp/release-notes.md
          fi
