name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector logo, icons, static web portals & build v1.7.0 APKs from source
        run: |
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full APK signature, Anti-Brick, Arc7 Browser, Root Shell & Wi-Fi verification
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed APKs, static web portals & 1-click Wi-Fi launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/KoboArc7Freedom.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.7.0 APKs & web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built APKs & Wi-Fi launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Upload GitHub Pages web installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish signed APKs & 1-click Wi-Fi servers to GitHub Releases (v1.7.0 latest + update earlier tags)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.7.0 (`ca.arc7freedom.app`)

          **Overhauled `Arc7 Browser` (Removed Buggy Lite Mode + 15x Faster Persistent TLS 1.3 Daemon + `gzip` + Redirect/Cookie/Form Fix), Fixed Real-Hardware `Test Root Shell` & Multi-Mode Persistent `su`, Plus Full `:8000` / `:8080` Wi-Fi Fixes!**

          ### Fixed & Improved in `v1.7.0`
          1. **Overhauled `Arc7 Browser` — Removed Buggy `Lite` Mode & Fixed All Page-Rendering Bugs (`Arc7BrowserActivity.java` + `native/arc7tls.c`):**
             - Removed the `Lite: ON / OFF` button, `Reader Lite` mode, destructive HTML/CSS regex stripping, and forced domain rewrites completely.
             - Replaced per-image/CSS/script `ProcessBuilder` spawning + 120-PEM X.509 re-parsing on Cortex-A7 with a single persistent multithreaded in-RAM `libarc7tls.so` daemon (`/__arc7_raw`, `0 ms` cert parse cost per resource).
             - Added automatic real-time `GZIPInputStream` (`Content-Encoding: gzip` / `0x1F 0x8B`) decompression so gzip-encoded modern pages & scripts render cleanly instead of raw binary garbage and transfer 6x faster over Wi-Fi.
             - Added clean `mimeType` vs `charset` separation for Android 4.2 WebKit strict MIME checks, `CookieManager` `Cookie` <-> `Set-Cookie` sync, automatic `<base href="...">` injection after HTTP redirects, GET search support on DuckDuckGo, Reload/Stop (`↻`/`✕`) button, soft-keyboard auto-hide on `Go`, and Desktop/Mobile toggle.
          2. **Fixed `"Rooted"` vs `"Test Root Shell"` Failure on Real Kobo Arc 7 Hardware (`MainActivity.java`, `RootShell.java`, `native/su.c`, `native/arc7_common.h`, `Arc7TerminalActivity.java`):**
             - Stock Android 4.2.2 (`toolbox`, no busybox) lacks `/system/bin/uname`, `head`, and `tail`: `testRootShellInteractive()` previously ran `id && uname -a && df /system /data`, which failed on `uname: not found` (`exitCode = 127`) and showed *"Root Not Active Yet"* even when `uid=0` was active! Now uses pure Android 4.2 `/proc/version` + separate `df /system` & `df /data` checks and verifies `uid=0` directly.
             - `RootShell.java` & `native/su.c` now test and support all 3 Android `su` conventions (`su -c "/system/bin/sh <script>"`, AOSP `su 0 /system/bin/sh <script>`, and `su` stdin pipe) via world-readable `0755` script files so zero quoting or non-PTY rejection errors can occur.
             - `native/arc7_common.h` + `native/su.c` now install `06755` setuid root `su` to RAM `/sbin/su` (immune to full `/system` partitions and `nosuid`!) as well as `/system/xbin/su` + `/system/bin/su`, detach daemon FDs `0..255` cleanly, and move `su --daemon` into `/acct/uid_0/tasks` so Android never kills it in the background.
          3. **Includes All `v1.6.0` Home Wi-Fi Sideload (`:8000`) & On-Tablet Wi-Fi Drive (`:8080`) Fixes:**
             - 1-Click Zero-Python Auto-Firewall Windows (`Start-Kobo-WiFi-Server.bat`) & Mac/Linux (`Start-Kobo-WiFi-Server.sh`) launchers + instant `<1 ms` Chrome/Safari HTTPS-First fallback + auto-starting Foreground `Wi-Fi Drive (:8080)`.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.7.0 >/dev/null 2>&1; then
            gh release upload v1.7.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.7.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.7.0 — Fixed Arc7 Browser (Removed Lite Mode), Root Shell Fix & 1-Click Wi-Fi Suite" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.6.0 v1.5.0 v1.4.0 v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/Start-Kobo-WiFi-Server.bat \
                releases/Start-Kobo-WiFi-Server.sh \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done
