name: Build, Verify & Deploy Kobo Arc 7 v1.9.1 OTA Portal

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru cryptography

      - name: Generate vector icons, build all 6 native ARMv7 binaries & sign all v1.9.1 APKs
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full v1.9.1 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v1.9.1 APKs, static OTA web portals & launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch releases/Upgrade-My-Kobo-To-v1.8.1.apk releases/Upgrade-My-Kobo-To-v1.8.2.apk
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Backup-Kobo-To-Laptop-ADB.bat \
            docs/Backup-Kobo-To-Laptop-ADB.sh \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v1.9.1.apk \
            releases/Upgrade-My-Kobo-To-v1.9.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.9.1 APKs & OTA web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v1.9.1 APKs, Aurora Store v4.8.5, F-Droid v1302, 1-Tap Upgrader & OTA launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/Upgrade-My-Kobo-To-v1.9.1.apk
            releases/KoboArc7Freedom.apk
            releases/AuroraStore.apk
            releases/FDroidClassicLegacy.apk
            releases/VanillaAndroid4Home.apk
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Enable & Configure GitHub Pages Over-The-Air Website
        id: cfg_pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage complete zero-redirect GitHub Pages OTA site (`_site/`) with direct hosted `.apk` binaries
        if: github.event_name != 'pull_request' && steps.cfg_pages.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf _site && mkdir -p _site
          cp -rf docs/* docs/.nojekyll _site/
          cp -f \
            releases/Upgrade-My-Kobo-To-v1.9.1.apk \
            releases/Upgrade-My-Kobo-To-v1.9.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            releases/SHA256SUMS.txt \
            _site/
          ls -lh _site/

      - name: Upload GitHub Pages OTA site artifact
        id: upload_pages
        if: github.event_name != 'pull_request' && steps.cfg_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish signed v1.9.1 APKs, Aurora Store v4.8.5, F-Droid v1302, 1-Tap Upgrader & OTA tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.9.1 (`ca.arc7freedom.app` v191 + `Upgrade-My-Kobo-To-v1.9.1.apk` + `AuroraStore.apk` v4.8.5 + `FDroidClassicLegacy.apk` v1302)

          ### Critical Hardware Fixes in `v1.9.1`:
          1. **Fixed Aurora Store APK `"Parse error: There is a problem parsing the package"` on Android 4.2.2:**
             - Queries **F-Droid Archive + F-Droid Main `index-v1.jar`** (`maxSdkVersion >= 17 >= minSdkVersion`) and verified ARMv7/universal Android 4.2 releases instead of returning `minSdkVersion >= 21` / `DEX 038/039` / `arm64-only` APKs from IzzyOnDroid.
             - Inspects every downloaded APK's binary `AndroidManifest.xml` (`minSdkVersion <= 17`), `classes*.dex` (`DEX 035`), and `lib/` ABIs (`armeabi-v7a` / `armeabi`) before install.
             - Automatically adds a compliant **4-byte `zipalign`ed `SHA1-Digest` + `SHA1withRSA` JAR `v1` signature** whenever a downloaded APK is `v2/v3`-only or `SHA256withRSA`-signed (fixing AOSP Bug `#38321` across Aurora Store, F-Droid Classic, Arc7 Browser, and Wi-Fi File Drive!).
             - Stages installs via world-readable `/data/local/tmp/` `pm install -r` to avoid Android 4.2 multi-user FUSE mount-namespace parse failures, and unwraps double-proxied `127.0.0.1:8118` URLs with widened `8 KB` URL buffers in `libarc7tls.so`.
          2. **Fixed F-Droid Classic `"Signing certificate does not match!"` (`f-droid certificates invalid`) Error:**
             - Fixed `default_repos` in `FDroidClassicLegacy.apk` (`versionCode = 1302`) where `str[462]` (`F-Droid Classic`) collided with `f-droid.org/repo` and overwrote F-Droid's `CN=Ciaran Gultnieks` (`43238D51...`) certificate with `CN=marcus-tux` (`5187CFD9...`) in SQLite on every first launch.
             - Re-mapped all 7 repository entries cleanly without URL collisions, added genuine **PKCS#7 `SHA256withRSA` `index-v1.jar` verification** on Android 4.2 (`IndexUpdater.getSigningCertFromJar`), preserved `/data/local/arc7_tls_ca/` across app reinstalls so Zygote's trusted CA never drifts, and auto-cleared stale `< 1302` SQLite state on upgrade.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.9.1 >/dev/null 2>&1; then
            gh release edit v1.9.1 --latest --title "Kobo Arc 7 Freedom v1.9.1 — Fixed Aurora Store APK Installs & Fixed F-Droid Certificates!" --notes-file /tmp/release-notes.md
            gh release upload v1.9.1 \
              releases/Upgrade-My-Kobo-To-v1.9.1.apk \
              releases/Upgrade-My-Kobo-To-v1.9.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.9.1 \
              releases/Upgrade-My-Kobo-To-v1.9.1.apk \
              releases/Upgrade-My-Kobo-To-v1.9.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.9.1 — Fixed Aurora Store APK Installs & Fixed F-Droid Certificates!" \
              --notes-file /tmp/release-notes.md
          fi

  deploy-pages:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: build-and-verify
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Over-The-Air Rooting Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
