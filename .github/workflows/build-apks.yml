name: Build, Verify & Release Kobo Arc 7 Freedom v2.4.1

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi, QRCode & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru cryptography qrcode

      - name: Generate 44 multi-DPI squircle icons, fetch & verify official VLC ARMv7 APK, compile native VPN/TLS binaries & sign all v2.4.1 APKs
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh releases/Start-Chromebook-Wired-Internet.sh releases/Start-Kobo-Second-Screen.py releases/Start-PC-Stream-Deck.py releases/Start-PC-Stream-Deck.sh releases/Start-PC-School-VPN-Relay.py tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          rm -f app/src/main/assets/starter-apps/VLC.apk releases/VLC.apk
          ./scripts/build-all.sh

      - name: Run full v2.4.1 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v2.4.1 APKs, local Wi-Fi portal assets, bundled VLC.apk & host tools back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch docs releases/Upgrade-My-Kobo-To-v1.9.0.apk releases/Upgrade-My-Kobo-To-v1.9.1.apk releases/Upgrade-My-Kobo-To-v2.0.0.apk releases/Upgrade-My-Kobo-To-v2.1.0.apk releases/Upgrade-My-Kobo-To-v2.2.0.apk releases/Upgrade-My-Kobo-To-v2.3.0.apk releases/Upgrade-My-Kobo-To-v2.3.1.apk releases/Upgrade-My-Kobo-To-v2.4.0.apk
          git add \
            releases/index.html \
            releases/logo-banner.png \
            releases/icons \
            releases/Upgrade-My-Kobo-To-v2.4.1.apk \
            releases/KoboArc7Freedom.apk \
            releases/VLC.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Start-PC-Stream-Deck.py \
            releases/Start-PC-Stream-Deck.bat \
            releases/Start-PC-Stream-Deck.sh \
            releases/Start-PC-School-VPN-Relay.py \
            releases/Start-Chromebook-Wired-Internet.sh \
            releases/Start-Kobo-Second-Screen.py \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk \
            app/src/main/assets/chromebook/Start-Chromebook-Wired-Internet.sh \
            app/src/main/assets/chromebook/Start-Kobo-Second-Screen.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.bat \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.sh \
            app/src/main/assets/chromebook/Start-PC-School-VPN-Relay.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v2.4.1 APKs, Local Web Installer Image Fix, Morphe YouTube & YouTube Music, Launcher v55 & Official Tailscale Google Auth [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v2.4.1 APKs, Local Wi-Fi Installer Portal, VLC, Aurora Store, F-Droid, Upgrader & Host Tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-v2.4.1-apks
          path: |
            releases/Upgrade-My-Kobo-To-v2.4.1.apk
            releases/KoboArc7Freedom.apk
            releases/VLC.apk
            releases/AuroraStore.apk
            releases/FDroidClassicLegacy.apk
            releases/VanillaAndroid4Home.apk
            releases/logo-banner.png
            releases/index.html
            releases/icons/*.png
            releases/Start-PC-Stream-Deck.py
            releases/Start-PC-Stream-Deck.bat
            releases/Start-PC-Stream-Deck.sh
            releases/Start-PC-School-VPN-Relay.py
            releases/Start-Chromebook-Wired-Internet.sh
            releases/Start-Kobo-Second-Screen.py
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Publish signed v2.4.1 APKs, Local Web Installer Assets, VLC Media Player & Host Tools to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v2.4.1 — Fixed Local Web Installer Image Loading, YouTube & YouTube Music (Morphe Edition), Home Widget Removal Fix, Universal Audio Standby, Clean App Labels & Official Tailscale Google Sign-In

          ### New in `v2.4.1` — Local Web Installer Image & Zero-SSL Portal Fix:
          - **Fixed Broken Images on Local Web Installer (`:8000` & `releases/index.html` & `:8080`):**
            - Resolved `NameError` crash in `tools/serve-over-wifi.py` on `GET /logo-banner.png` AND added inline `image/*` MIME headers (`image/png`, `image/jpeg`, `image/svg+xml`, `image/webp`, `image/gif`, `image/x-icon`) without `Content-Disposition: attachment` across `tools/serve-over-wifi.py`, `Start-Kobo-WiFi-Server.bat`, `Start-Kobo-WiFi-Server.sh`, `releases/index.html` (`releases/icons/*.png`), and `Arc7WifiDriveService` (`:8080/logo.png`), with embedded base64 PNG fallbacks so images render cleanly even 100% offline.
            - Updated `Browser` (`Arc7BrowserActivity`) so all plain `http://` pages & `<img>` subresources across every LAN / iPhone Hotspot (`172.20.10.x`) / Tailscale (`100.x.y.z`) / hostname:port address stream natively in WebKit without TLS-daemon interception.

          ### All 6 Major Upgrades from `v2.4.0` Included:
          1. **Fixed `YouTube` App (Morphe Edition for Android 4.2.2)** — Non-SABR InnerTube multi-client cascade + local `127.0.0.1:18977` `206` TLS 1.3 stream proxy + SponsorBlock + RYD + offline `.mp4`/`.m4a`.
          2. **New Standalone `YouTube Music` App (Morphe Edition)** — AMOLED dark player, background M4A audio, SponsorBlock skip, synced LRC lyrics, queue/shuffle/repeat & 5-band equalizer.
          3. **Fixed Home Screen Widget Removal (`VanillaAndroid4Home v55`)** — `InterceptingWidgetHostView.onInterceptTouchEvent` + 1-tap `✕ Remove` badge in `Rearrange` mode + Active Page Widget Manager.
          4. **Universal Now Playing Notification + Clock Standby Display** — Live transport notifications + Clock Standby Now-Playing controls across all built-in & system players.
          5. **Clean System App Names (`Arc7` Strictly Reserved for `Arc7 Freedom`)** — Clean standard labels on every standalone app, widget & launcher icon.
          6. **Official Tailscale Authentication with Google Sign-In (`Wi-Fi & VPN`)** — `tailscale_1.78.1_arm.tgz` + standards-compliant ISO/IEC 18004 QR code + Google SSO.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v2.4.1 >/dev/null 2>&1; then
            gh release edit v2.4.1 --latest --title "Kobo Arc 7 Freedom v2.4.1 — Local Web Installer Image Fix, Morphe YouTube + YouTube Music, Widget Removal Fix, Standby Audio & Official Tailscale Google Auth" --notes-file /tmp/release-notes.md
            gh release upload v2.4.1 \
              releases/Upgrade-My-Kobo-To-v2.4.1.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/logo-banner.png \
              releases/index.html \
              releases/Start-PC-Stream-Deck.py \
              releases/Start-PC-Stream-Deck.bat \
              releases/Start-PC-Stream-Deck.sh \
              releases/Start-PC-School-VPN-Relay.py \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Start-Kobo-Second-Screen.py \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v2.4.1 \
              releases/Upgrade-My-Kobo-To-v2.4.1.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/logo-banner.png \
              releases/index.html \
              releases/Start-PC-Stream-Deck.py \
              releases/Start-PC-Stream-Deck.bat \
              releases/Start-PC-Stream-Deck.sh \
              releases/Start-PC-School-VPN-Relay.py \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Start-Kobo-Second-Screen.py \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v2.4.1 — Local Web Installer Image Fix, Morphe YouTube + YouTube Music, Widget Removal Fix, Standby Audio & Official Tailscale Google Auth" \
              --notes-file /tmp/release-notes.md
          fi
