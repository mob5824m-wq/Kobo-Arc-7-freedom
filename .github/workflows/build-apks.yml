name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector logo, icons, static web portals & build v1.8.1 APKs from source
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full v1.8.1 Permanent Signing Cert, Pure-Toolbox Root, Upgrader, SSL TLS 1.3, Widgets, F-Droid & USB Backup verification
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v1.8.1 APKs, static web portals & 1-click USB/Wi-Fi launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Backup-Kobo-To-Laptop-ADB.bat \
            docs/Backup-Kobo-To-Laptop-ADB.sh \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v1.8.1.apk \
            releases/KoboArc7Freedom.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.8.1 APKs & web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v1.8.1 APKs, 1-Tap Upgrader, USB ADB Backup & Wi-Fi launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/Upgrade-My-Kobo-To-v1.8.1.apk
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Upload GitHub Pages web installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish signed v1.8.1 APKs, 1-Tap Root Upgrader & USB ADB / Wi-Fi tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.8.1 (`ca.arc7freedom.app` + `Upgrade-My-Kobo-To-v1.8.1.apk`)

          **Critical Real-Hardware Root & Upgrade Fix (`v1.8.1`) — Fixes `"sh:<stdin>[1]: uname: not found"` + Fixes APK Upgrade Signature Conflicts Forever:**

          ### ALREADY HAVE AN EARLIER VERSION (`v1.5.0` – `v1.8.0`) ON YOUR KOBO ARC 7?
          Download and install **`Upgrade-My-Kobo-To-v1.8.1.apk`** (`ca.arc7freedom.upgrader`) in 1 tap!
          - Why earlier updates failed to install: previous CI builds generated ephemeral signing certificates, causing Android 4.2 `PackageInstaller` to reject upgrades with `"App not installed"` (`INSTALL_PARSE_FAILED_INCONSISTENT_CERTIFICATES`), keeping your tablet stuck on `v1.5.0`/`v1.6.0` (which ran `id && uname -a` even though stock Kobo Android 4.2 `/system/bin/toolbox` omits `uname` and `cp`!).
          - **`Upgrade-My-Kobo-To-v1.8.1.apk`** installs cleanly with **zero signature conflict** and uses your tablet's already-working `uid=0(root)` `su` to automatically install in 5 seconds:
            1. Multi-call **`/sbin/{su,uname,cp}`** + **`/system/xbin/{su,uname,cp}`** native ARMv7 applets
            2. **`KoboArc7Freedom v1.8.1`** signed with our permanent version-controlled certificate (`keystore/arc7freedom-release.jks`) so every future release updates seamlessly in-place forever!
            3. **`VanillaAndroid4Home v4.2.8` (`v48`)** with working Home Screen Widgets + isolated app task stacks
            4. **`FDroidClassicLegacy v1.8.1`** pre-configured for our instant `http://127.0.0.1:8118/__https/...` TLS 1.3 repository bridge
            5. **All 120 modern 2026 Root CA `.0` certificates** directly into `/system/etc/security/cacerts/` via pure `mksh` + `cat` (zero reliance on `/system/bin/cp` or `grep`!)
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.8.1 >/dev/null 2>&1; then
            gh release upload v1.8.1 \
              releases/Upgrade-My-Kobo-To-v1.8.1.apk \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.8.1 \
              releases/Upgrade-My-Kobo-To-v1.8.1.apk \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.8.1 — 1-Tap Root Upgrader + Fixed 'uname/cp not found' + Permanent Signing Cert + TLS 1.3 + Widgets + F-Droid!" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.8.0 v1.7.0 v1.6.0 v1.5.0 v1.4.0 v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/Upgrade-My-Kobo-To-v1.8.1.apk \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/Backup-Kobo-To-Laptop-ADB.bat \
                releases/Backup-Kobo-To-Laptop-ADB.sh \
                releases/Start-Kobo-WiFi-Server.bat \
                releases/Start-Kobo-WiFi-Server.sh \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done
