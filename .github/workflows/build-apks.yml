name: Build, Verify & Release Kobo Arc 7 Freedom v2.5.4

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi, QRCode & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru cryptography qrcode

      - name: Generate 44 multi-DPI squircle icons, fetch & verify official VLC ARMv7 APK, compile native VPN/TLS binaries & sign all v2.5.4 APKs
        run: |
          chmod +x scripts/build-all.sh tools/Backup-Kobo-To-Laptop-ADB.sh tools/Start-Chromebook-Wired-Internet.sh tools/Start-Kobo-Second-Screen.py tools/Start-PC-Stream-Deck.py tools/Start-PC-Stream-Deck.sh tools/Start-PC-School-VPN-Relay.py tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          rm -f app/src/main/assets/starter-apps/VLC.apk releases/VLC.apk
          ./scripts/build-all.sh

      - name: Run full v2.5.4 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v2.5.4 APKs, local Wi-Fi portal assets, bundled VLC.apk & host tools back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch docs releases/Upgrade-My-Kobo-To-v1.9.0.apk releases/Upgrade-My-Kobo-To-v1.9.1.apk releases/Upgrade-My-Kobo-To-v2.0.0.apk releases/Upgrade-My-Kobo-To-v2.1.0.apk releases/Upgrade-My-Kobo-To-v2.2.0.apk releases/Upgrade-My-Kobo-To-v2.3.0.apk releases/Upgrade-My-Kobo-To-v2.3.1.apk releases/Upgrade-My-Kobo-To-v2.4.0.apk releases/Upgrade-My-Kobo-To-v2.4.1.apk releases/Upgrade-My-Kobo-To-v2.5.3.apk
          git add \
            releases/index.html \
            releases/logo-banner.png \
            releases/icons \
            releases/Upgrade-My-Kobo-To-v2.5.4.apk \
            releases/KoboArc7Freedom.apk \
            releases/YouTube.apk \
            releases/YouTubeMusic.apk \
            releases/VLC.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            tools/Start-PC-Stream-Deck.py \
            tools/Start-PC-Stream-Deck.bat \
            tools/Start-PC-Stream-Deck.sh \
            tools/Start-PC-School-VPN-Relay.py \
            tools/Start-Chromebook-Wired-Internet.sh \
            tools/Start-Kobo-Second-Screen.py \
            tools/Backup-Kobo-To-Laptop-ADB.bat \
            tools/Backup-Kobo-To-Laptop-ADB.sh \
            tools/Start-Kobo-WiFi-Server.bat \
            tools/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk \
            app/src/main/assets/chromebook/Start-Chromebook-Wired-Internet.sh \
            app/src/main/assets/chromebook/Start-Kobo-Second-Screen.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.bat \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.sh \
            app/src/main/assets/chromebook/Start-PC-School-VPN-Relay.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v2.5.4 APKs (shared offline maintenance + F-Droid array normalization) [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v2.5.4 APKs, Local Wi-Fi Installer Portal, VLC, Aurora Store, F-Droid, Upgrader & Host Tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-v2.5.4-apks
          path: |
            releases/apps/*.apk
            releases/WEATHER-FEATURES.md
            releases/INSTALL-RUNTIME-FIXES.md
            releases/Upgrade-My-Kobo-To-v2.5.4.apk
            releases/YouTube.apk
            releases/YouTubeMusic.apk
            releases/KoboArc7Freedom.apk
            releases/VLC.apk
            releases/AuroraStore.apk
            releases/FDroidClassicLegacy.apk
            releases/VanillaAndroid4Home.apk
            releases/logo-banner.png
            releases/index.html
            releases/icons/*.png
            tools/Start-PC-Stream-Deck.py
            tools/Start-PC-Stream-Deck.bat
            tools/Start-PC-Stream-Deck.sh
            tools/Start-PC-School-VPN-Relay.py
            tools/Start-Chromebook-Wired-Internet.sh
            tools/Start-Kobo-Second-Screen.py
            tools/Backup-Kobo-To-Laptop-ADB.bat
            tools/Backup-Kobo-To-Laptop-ADB.sh
            tools/Start-Kobo-WiFi-Server.bat
            tools/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Publish signed v2.5.4 APKs (suite + 28 standalone default apps + YouTube / YouTube Music) to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v2.5.4 — All-Method Maintenance + F-Droid Array Fix

          - The full suite and upgrader bundle Home, stores, YouTube and **all 28 independent default apps** offline (34 APKs total), including Clock/Music/Radio/Recorder/Package Installer repairs.
          - Direct APK, SD, OTA, USB/ADB, backup tools, rooting, boot/update and in-place conversion use one restartable patch pipeline. Generated Clean Android ROM ZIPs include the complete suite too.
          - Open Arc7 Freedom once, then **Step 1 > Install / Repair All Patches**. Root applies in-place updates. Without root, tap **Install pending apps** and confirm each APK in Android; root-only steps remain pending.
          - Same-version patches use SHA-256 comparisons and installed read-back. Newer packages are kept. Signature/storage failures **never** automatically uninstall, clear app data, remove existing system APKs or claim success.
          - F-Droid **1305** normalizes ArrayList/String[] repository mirrors and push-request values, fixing `java.util.ArrayList cannot be cast to java.lang.String[]` while preserving repo data and previous TLS/signature/low-memory patches.
          - Offline CA/CLI/Home provisioning repairs and old Arc7-only proxy migration are shared. Optional firmware flashing, wiping, OS conversion/stock-app removal, ad blocking, storage changes, VPN/proxy/tethering are not automatically enabled.
          - Earlier notification ownership, App Info/uninstall ownership, independent app networking, Bluetooth PAN tools and YouTube/Music media-pipeline work are retained.

          **Validation:** API17/ARMv7/DEX035/permanent v1-v3 signing gates; executable F-Droid/installer regressions; exact reconstruction of every signed APK; host ADB failure tests; existing offline media/routing/proxy/reader/Bluetooth regressions. No physical Kobo, ROM flash, live YouTube or PAN hardware was used. Windows install helpers are checked statically. Root/ROM/storage/hardware restrictions remain possible; inspect the visible patch report.

          See `releases/INSTALL-RUNTIME-FIXES.md` and `SHA256SUMS.txt`. Stop playback and back up important data before updates. Third-party ROMs need the suite reinstalled afterward. Individual app APKs update only the selected app.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v2.5.4 >/dev/null 2>&1; then
            gh release edit v2.5.4 --latest --title "Kobo Arc 7 Freedom v2.5.4 — All-Method Maintenance + F-Droid Fix" --notes-file /tmp/release-notes.md
            gh release upload v2.5.4 \
              releases/Upgrade-My-Kobo-To-v2.5.4.apk \
              releases/KoboArc7Freedom.apk \
              releases/YouTube.apk \
              releases/YouTubeMusic.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/apps/*.apk \
              releases/logo-banner.png \
              releases/index.html \
              tools/Start-PC-Stream-Deck.py \
              tools/Start-PC-Stream-Deck.bat \
              tools/Start-PC-Stream-Deck.sh \
              tools/Start-PC-School-VPN-Relay.py \
              tools/Start-Chromebook-Wired-Internet.sh \
              tools/Start-Kobo-Second-Screen.py \
              tools/Backup-Kobo-To-Laptop-ADB.bat \
              tools/Backup-Kobo-To-Laptop-ADB.sh \
              tools/Start-Kobo-WiFi-Server.bat \
              tools/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber || { echo "retrying release upload once..."; sleep 15; gh release upload v2.5.4 \
              releases/Upgrade-My-Kobo-To-v2.5.4.apk releases/KoboArc7Freedom.apk releases/YouTube.apk releases/YouTubeMusic.apk \
              releases/VLC.apk releases/AuroraStore.apk releases/FDroidClassicLegacy.apk releases/VanillaAndroid4Home.apk \
              releases/apps/*.apk releases/logo-banner.png releases/index.html releases/SHA256SUMS.txt \
              tools/Start-PC-Stream-Deck.py tools/Start-PC-Stream-Deck.bat tools/Start-PC-Stream-Deck.sh \
              tools/Start-PC-School-VPN-Relay.py tools/Start-Chromebook-Wired-Internet.sh tools/Start-Kobo-Second-Screen.py \
              tools/Backup-Kobo-To-Laptop-ADB.bat tools/Backup-Kobo-To-Laptop-ADB.sh \
              tools/Start-Kobo-WiFi-Server.bat tools/Start-Kobo-WiFi-Server.sh --clobber; }
          else
            gh release create v2.5.4 \
              releases/Upgrade-My-Kobo-To-v2.5.4.apk \
              releases/KoboArc7Freedom.apk \
              releases/YouTube.apk \
              releases/YouTubeMusic.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/apps/*.apk \
              releases/logo-banner.png \
              releases/index.html \
              tools/Start-PC-Stream-Deck.py \
              tools/Start-PC-Stream-Deck.bat \
              tools/Start-PC-Stream-Deck.sh \
              tools/Start-PC-School-VPN-Relay.py \
              tools/Start-Chromebook-Wired-Internet.sh \
              tools/Start-Kobo-Second-Screen.py \
              tools/Backup-Kobo-To-Laptop-ADB.bat \
              tools/Backup-Kobo-To-Laptop-ADB.sh \
              tools/Start-Kobo-WiFi-Server.bat \
              tools/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v2.5.4 — All-Method Maintenance + F-Droid Fix" \
              --notes-file /tmp/release-notes.md
          fi
