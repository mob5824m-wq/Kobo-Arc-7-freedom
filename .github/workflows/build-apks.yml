name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector logo, icons, static web portals & build v1.8.0 APKs from source
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full v1.8.0 APK signature, SSL TLS 1.0->1.3, Separate Tasks, Widgets, F-Droid & USB ADB Backup verification
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v1.8.0 APKs, static web portals & 1-click USB/Wi-Fi launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Backup-Kobo-To-Laptop-ADB.bat \
            docs/Backup-Kobo-To-Laptop-ADB.sh \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/KoboArc7Freedom.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.8.0 APKs & web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v1.8.0 APKs, USB ADB Backup & Wi-Fi launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Upload GitHub Pages web installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish signed v1.8.0 APKs & 1-click USB ADB / Wi-Fi tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.8.0 (`ca.arc7freedom.app`)

          **Major Real-Hardware Fix & Feature Release — Fixes All 5 User-Reported Issues on Kobo Arc 7 (`Android 4.2.2`):**

          1. **Fixed `"SSL connection error"` Everywhere (`native/arc7tls.c`, `Arc7TlsGatewayService`, `NetworkCertManager`, `Arc7BrowserActivity`):**
             - **Root Cause Found:** Android 4.2's 2013 OpenSSL sends `TLS 1.0` `ClientHello`s by default, while `Mbed-TLS 3.6` rejected every `TLS 1.0 / 1.1` handshake immediately AND `MainActivity.onDestroy()` previously stopped `127.0.0.1:8118` whenever you switched apps!
             - **Fix:** `libarc7tls.so` now embeds **BearSSL `TLS 1.0 / 1.1 / 1.2`** for local Android 4.2 app connections + **Mbed-TLS 3.6 `TLS 1.3`** for upstream 2026 internet servers, runs persistently inside `Arc7TlsGatewayService` (`START_STICKY`), generates `notBefore = 2012-01-01` local certificates immune to dead-battery 2013 clocks, bypasses system proxy loops on `127.0.0.1`, syncs `X-Arc7-Cookie` headers, and overrides `onReceivedSslError` cleanly.
          2. **Fixed `"All apps just open Arc Freedom"` (`app/src/main/AndroidManifest.xml`, `VanillaHomeActivity.java`):**
             - Every single standalone app activity (`Arc7 Browser`, `Arc7 E-Reader`, `Arc7 Audio`, `Arc7 Clock`, `Arc7 Nightstand`, `Arc7 Wallpapers`, `Arc7 App Manager`, `Arc7 Terminal`) now declares its **own independent `android:taskAffinity="ca.arc7freedom.task.*"`** + `singleTask`, and `VanillaAndroid4Home` launches every app cleanly into an isolated task stack instead of re-foregrounding `MainActivity`!
          3. **Added Direct Laptop Backup & Restore via USB ADB — Uses `0 MB` of Tablet Space! (`Arc7AdbBackupService`, Tab 3 UI, `Backup-Kobo-To-Laptop-ADB.bat / .sh`):**
             - Streams bit-for-bit partitions (`boot`, `recovery`, `nvram` Wi-Fi MAC calibration, `uboot`, `system.ext4.img`), partition layout, `build.prop`, and personal media files directly over USB (`adb forward tcp:18777 tcp:18777`) onto Windows / macOS / Linux with full live `SHA-256` verification!
          4. **Home Screen Widgets Now Work + 3 Built-In Arc7 Widgets (`VanillaAndroid4Home v48` + `Arc7Clock/Audio/PowerWidgetProvider`):**
             - Full `AppWidgetHost` + `AppWidgetManager` support in `VanillaAndroid4Home.apk` (`+ Widget` top button OR long-press empty space on home screen, resize height, long-press to remove, persists across reboots) plus 3 built-in widgets (**Digital Clock & Next Alarm**, **Music & Audiobook Player**, **Quick Dock & Live TLS 1.3 Status**).
          5. **Fixed `"F-Droid error getting index file"` (`scripts/patch-fdroid-apk.py` + `/__https/...` Bridge + Auto-Upgrade):**
             - Patched `FDroidClassicLegacy.apk`'s compiled `resources.arsc` (`default_repos`) to route through our verified local `http://127.0.0.1:8118/__https/...` TLS 1.3 gateway, removed defunct `bubu1.eu` & TLS-1.3-only `ftp.fau.de` errors, enabled official **F-Droid + F-Droid Archive** out of the box, and auto-migrates older installs cleanly!
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.8.0 >/dev/null 2>&1; then
            gh release upload v1.8.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.8.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.8.0 — Fixed SSL Error, Fixed App Task Launching, USB ADB Laptop Backup, Home Widgets & Fixed F-Droid Index!" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.7.0 v1.6.0 v1.5.0 v1.4.0 v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/Backup-Kobo-To-Laptop-ADB.bat \
                releases/Backup-Kobo-To-Laptop-ADB.sh \
                releases/Start-Kobo-WiFi-Server.bat \
                releases/Start-Kobo-WiFi-Server.sh \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done
