name: Build, Verify & Release Kobo Arc 7 Freedom v2.4.0

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi, QRCode & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru cryptography qrcode

      - name: Generate 44 multi-DPI squircle icons, fetch & verify official VLC ARMv7 APK, compile native VPN/TLS binaries & sign all v2.4.0 APKs
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh releases/Start-Chromebook-Wired-Internet.sh releases/Start-Kobo-Second-Screen.py releases/Start-PC-Stream-Deck.py releases/Start-PC-Stream-Deck.sh releases/Start-PC-School-VPN-Relay.py tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          rm -f app/src/main/assets/starter-apps/VLC.apk releases/VLC.apk
          ./scripts/build-all.sh

      - name: Run full v2.4.0 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v2.4.0 APKs, bundled VLC.apk & host tools back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch docs releases/Upgrade-My-Kobo-To-v1.9.0.apk releases/Upgrade-My-Kobo-To-v1.9.1.apk releases/Upgrade-My-Kobo-To-v2.0.0.apk releases/Upgrade-My-Kobo-To-v2.1.0.apk releases/Upgrade-My-Kobo-To-v2.2.0.apk releases/Upgrade-My-Kobo-To-v2.3.0.apk releases/Upgrade-My-Kobo-To-v2.3.1.apk
          git add \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v2.4.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/VLC.apk \
            releases/AuroraStore.apk \
            releases/FDroidClassicLegacy.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Start-PC-Stream-Deck.py \
            releases/Start-PC-Stream-Deck.bat \
            releases/Start-PC-Stream-Deck.sh \
            releases/Start-PC-School-VPN-Relay.py \
            releases/Start-Chromebook-Wired-Internet.sh \
            releases/Start-Kobo-Second-Screen.py \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk \
            app/src/main/assets/chromebook/Start-Chromebook-Wired-Internet.sh \
            app/src/main/assets/chromebook/Start-Kobo-Second-Screen.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.py \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.bat \
            app/src/main/assets/chromebook/Start-PC-Stream-Deck.sh \
            app/src/main/assets/chromebook/Start-PC-School-VPN-Relay.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v2.4.0 APKs, YouTube & YouTube Music Morphe, Launcher v54 & Official Tailscale Google Auth [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v2.4.0 APKs, VLC Media Player, Aurora Store, F-Droid, Upgrader & Stream Deck / VPN tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-v2.4.0-apks
          path: |
            releases/Upgrade-My-Kobo-To-v2.4.0.apk
            releases/KoboArc7Freedom.apk
            releases/VLC.apk
            releases/AuroraStore.apk
            releases/FDroidClassicLegacy.apk
            releases/VanillaAndroid4Home.apk
            releases/Start-PC-Stream-Deck.py
            releases/Start-PC-Stream-Deck.bat
            releases/Start-PC-Stream-Deck.sh
            releases/Start-PC-School-VPN-Relay.py
            releases/Start-Chromebook-Wired-Internet.sh
            releases/Start-Kobo-Second-Screen.py
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Publish signed v2.4.0 APKs, VLC Media Player & Host Tools to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v2.4.0 — YouTube & YouTube Music (Morphe Edition), Home Widget Removal Fix, Universal Audio Notification + Clock Standby, Clean App Labels & Official Tailscale Google Sign-In

          ### All 6 Major Upgrades in `v2.4.0`:
          1. **Fixed `YouTube` App (Morphe Edition for Android 4.2.2):**
             - Non-SABR October 2026 InnerTube multi-client cascade (`ANDROID_VR 1.64.34` Pico A8110, `VISIONOS 1.03`, `ANDROID_XR 1.69.27`, `ANDROID_MUSIC 7.12.52`, `TVHTML5`, `IOS 21.26.4` + Piped/Invidious fallback) + local `http://127.0.0.1:18977` `206 Partial Content` `Range: bytes=...` TLS 1.3 stream proxy that solves stock Android `4.2.2` Stagefright `MediaPlayer error (1, -1004)` on `googlevideo.com`, plus SponsorBlock auto-skip, Return YouTube Dislike counts, comments, background audio, and offline MP4/M4A downloads.
          2. **New Standalone `YouTube Music` App (Morphe Edition):**
             - Own squircle launcher icon & isolated `taskAffinity`, Morphe AMOLED dark player UI, song/album/artist/playlist search & quick picks, 128–160 kbps M4A background streaming, SponsorBlock non-music auto-skip, synced LRC lyrics, queue/shuffle/repeat, 5-band equalizer, and offline downloads.
          3. **Fixed Home Screen Widget Removal (`VanillaAndroid4Home v54`):**
             - Custom `InterceptingWidgetHostView.onInterceptTouchEvent` (catches 420 ms long-press even when touching clickable child views inside `RemoteViews`), 1-tap red `✕ Remove` badge on every widget whenever `Rearrange` mode is active, drag-to-remove drop bar, and **Manage / Remove Widgets** dialog on Home long-press calling `AppWidgetHost.deleteAppWidgetId(id)`.
          4. **Universal Now Playing Notification + Clock Standby Display:**
             - Any playing audio across built-in apps (`YouTube Music`, `YouTube`, `Music`, `Radio & Podcasts`, `Voice Recorder`, `Browser`) AND third-party system players (`VLC`, etc.) posts a rich Android `4.2` transport notification (`Prev / Play-Pause / Next / Stop`) AND shows a live **NOW PLAYING** transport card on **Clock Standby**.
          5. **Clean Native App Names (`Arc7` Reserved Strictly for `Arc7 Freedom`):**
             - Every single standalone app, widget, launcher tile, and auxiliary APK carries a clean standard title (`YouTube`, `YouTube Music`, `Browser`, `Clock`, `Music`, `Radio & Podcasts`, `Wi-Fi & VPN`, `Home`, `Aurora Store`, `System Upgrader`, etc.) — ONLY `Arc7 Freedom` uses `Arc7`.
          6. **Official Tailscale Authentication with Google Sign-In (`Wi-Fi & VPN`):**
             - Downloads Linux `3.4.5`-compatible official `tailscale_1.78.1_arm.tgz` on Kobo Arc 7, renders genuine standards-compliant **ISO/IEC 18004 QR codes** (`QrCodeEncoder`) for official `https://login.tailscale.com/a/...` Google OAuth URLs, provides 1-tap tablet browser Google SSO + Sign Out, and waits until `BackendState == "Running"` before binding `VpnService`.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v2.4.0 >/dev/null 2>&1; then
            gh release edit v2.4.0 --latest --title "Kobo Arc 7 Freedom v2.4.0 — YouTube + YouTube Music (Morphe), Widget Removal Fix, Universal Audio Standby & Official Tailscale Google Auth" --notes-file /tmp/release-notes.md
            gh release upload v2.4.0 \
              releases/Upgrade-My-Kobo-To-v2.4.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-PC-Stream-Deck.py \
              releases/Start-PC-Stream-Deck.bat \
              releases/Start-PC-Stream-Deck.sh \
              releases/Start-PC-School-VPN-Relay.py \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Start-Kobo-Second-Screen.py \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v2.4.0 \
              releases/Upgrade-My-Kobo-To-v2.4.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/VLC.apk \
              releases/AuroraStore.apk \
              releases/FDroidClassicLegacy.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-PC-Stream-Deck.py \
              releases/Start-PC-Stream-Deck.bat \
              releases/Start-PC-Stream-Deck.sh \
              releases/Start-PC-School-VPN-Relay.py \
              releases/Start-Chromebook-Wired-Internet.sh \
              releases/Start-Kobo-Second-Screen.py \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v2.4.0 — YouTube + YouTube Music (Morphe), Widget Removal Fix, Universal Audio Standby & Official Tailscale Google Auth" \
              --notes-file /tmp/release-notes.md
          fi
