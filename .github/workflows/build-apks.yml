name: Build, Verify & Deploy Kobo Arc 7 v1.9.0 OTA Portal

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector icons, build all 6 native ARMv7 binaries & sign all 4 v1.9.0 APKs
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh tools/serve-over-wifi.sh
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full v1.9.0 end-to-end verification suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v1.9.0 APKs, static OTA web portals & launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch releases/Upgrade-My-Kobo-To-v1.8.1.apk releases/Upgrade-My-Kobo-To-v1.8.2.apk
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Backup-Kobo-To-Laptop-ADB.bat \
            docs/Backup-Kobo-To-Laptop-ADB.sh \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v1.9.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/AuroraStore.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/AuroraStore.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.9.0 APKs & OTA web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v1.9.0 APKs, Aurora Store, 1-Tap Upgrader & OTA launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/Upgrade-My-Kobo-To-v1.9.0.apk
            releases/KoboArc7Freedom.apk
            releases/AuroraStore.apk
            releases/VanillaAndroid4Home.apk
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Enable & Configure GitHub Pages Over-The-Air Website
        id: cfg_pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage complete zero-redirect GitHub Pages OTA site (`_site/`) with direct hosted `.apk` binaries
        if: github.event_name != 'pull_request' && steps.cfg_pages.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf _site && mkdir -p _site
          cp -rf docs/* docs/.nojekyll _site/
          cp -f \
            releases/Upgrade-My-Kobo-To-v1.9.0.apk \
            releases/KoboArc7Freedom.apk \
            releases/AuroraStore.apk \
            releases/VanillaAndroid4Home.apk \
            releases/SHA256SUMS.txt \
            _site/
          ls -lh _site/

      - name: Upload GitHub Pages OTA site artifact
        id: upload_pages
        if: github.event_name != 'pull_request' && steps.cfg_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish signed v1.9.0 APKs, Aurora Store, 1-Tap Upgrader & OTA tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.9.0 (`ca.arc7freedom.app` + `Upgrade-My-Kobo-To-v1.9.0.apk` + `AuroraStore.apk` + `VanillaAndroid4Home.apk` v49)

          ### Over-The-Air (OTA) Web Portal (Now Live & Fixed!):
          - **Direct Cloud OTA Website:** **https://mob5824m-wq.github.io/Kobo-Arc-7-freedom/** (serves every `.apk` with direct `200 OK` Fastly CDN binary streaming — zero `302` S3 redirects!)
          - **Local Home Wi-Fi OTA Server:** `Start-Kobo-WiFi-Server.bat` (Windows concurrent socket threadpool + `Range: bytes=` support) / `Start-Kobo-WiFi-Server.sh` (macOS/Linux `ThreadingHTTPServer`)

          ### All 12 Upgrades in `v1.9.0`:
          1. **Automatic Local Timezone + Atomic Clock Sync:** Automatically detects your real IANA timezone (`e.g. America/Toronto`) via 4 geo-timezone endpoints and sets both `AlarmManager.setTimeZone` + `persist.sys.timezone` alongside kernel UTC epoch (`settimeofday`) with zero UTC-offset bugs.
          2. **Fixed Over-The-Air Rooting & Upgrade Website:** Enabled & deployed live GitHub Pages (`https://mob5824m-wq.github.io/Kobo-Arc-7-freedom/`) with direct `200 OK` `.apk` hosting + fixed multi-socket concurrent Windows/Mac/Linux local Wi-Fi OTA servers.
          3. **Automatic Default Stock Launcher Removal:** Archives & uninstalls stock `Launcher2.apk` (`com.android.launcher`, `com.kobo.home`, `com.kobo.tapestry`) cleanly once `VanillaAndroid4Home` is active.
          4. **Bundled & Auto-Installed Aurora Store (`com.aurora.store`):** Native Android 4.2 (`minSdk=15`, `DEX 035`) + TLS 1.3 Google Play Store client pre-bundled and auto-installed on every Kobo Arc 7.
          5. **Smooth 60 fps Animations Across All Custom Apps:** Hardware-accelerated slide/fade activity transitions, spring touch feedback, animated tab/drawer switches, and `LayoutTransition` animations across all custom apps.
          6. **Removed `Kobo Care` & Discontinued Preloads:** Archives & removes `Kobo Care`, `Pocket`, `Zinio`, `7digital`, `Rdio`, `Google+`, `Talk`/`Hangouts`, `Currents`/`Magazines`, `GoogleEars`, `Videos`, and `GenieWidget`.
          7. **Long-Press Home Screen to Add Widgets (`VanillaAndroid4Home` v49):** Long-press anywhere on the Home Screen workspace to add widgets.
          8. **Removed `+ Widget` Button & `"Tap + to add widgets"` Clutter:** Clean, uncluttered stock Android Home Screen.
          9. **Full 12-Hour (`AM/PM`) Time Support:** 12-hour & 24-hour time support across Clock, Alarms, World Clocks, Nightstand, Wake Alert, Home Widget, and Launcher.
          10. **14 Nostalgic Apple & Nostalgic Android Alarm Chimes:** Polyphonic Karplus-Strong & bell synthesis of *Marimba*, *Radar*, *Opening*, *Xylophone*, *Harp*, *Chimes*, *Sci-Fi*, *Helium*, *Oxygen*, *Pyxis*, *Cesium*, *Argon*, *Holo Pop*, plus *Classic Twin-Bell* with live preview.
          11. **Individual Per-Alarm Volume (`0%–100%`):** Independent volume slider & audio level persisted per alarm.
          12. **Automatic Native `python3` & `apt` Installation:** Static ARMv7 `python3` + `apt` (`apt update`, `apt install`, `apt search`) pre-installed in `/system/xbin/` + automatic background Alpine `armv7` CPython 3.12 + `pip3` sync in `/data/local/arc7linux`.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.9.0 >/dev/null 2>&1; then
            gh release edit v1.9.0 --latest --title "Kobo Arc 7 Freedom v1.9.0 — Live OTA Portal, Auto Timezone, Aurora Store, Python 3 + apt, 12h & Chimes!" --notes-file /tmp/release-notes.md
            gh release upload v1.9.0 \
              releases/Upgrade-My-Kobo-To-v1.9.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/AuroraStore.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.9.0 \
              releases/Upgrade-My-Kobo-To-v1.9.0.apk \
              releases/KoboArc7Freedom.apk \
              releases/AuroraStore.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.9.0 — Live OTA Portal, Auto Timezone, Aurora Store, Python 3 + apt, 12h & Chimes!" \
              --notes-file /tmp/release-notes.md
          fi

  deploy-pages:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: build-and-verify
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Over-The-Air Rooting Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
