name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector logo, icons, static web portals & build v1.6.0 APKs from source
        run: |
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full APK signature, Anti-Brick, Wi-Fi Server (:8000), Wi-Fi Drive (:8080) & TLS 1.3 verification
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed APKs, static web portals & 1-click Wi-Fi launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/KoboArc7Freedom.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.6.0 APKs & web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built APKs & Wi-Fi launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Upload GitHub Pages web installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish signed APKs & 1-click Wi-Fi servers to GitHub Releases (v1.6.0 latest + update earlier tags)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.6.0 (`ca.arc7freedom.app`)

          **Complete Fix & Upgrade for Local Home Wi-Fi Installer (`:8000`), 1-Click Zero-Python Auto-Firewall Windows/Mac/Linux Launchers, Live Web Portal, On-Tablet Wi-Fi File Drive (`:8080`) & `Arc7 Browser` (`:8118`)!**

          ### New in `v1.6.0`
          1. **1-Click Zero-Python, Auto-Firewall Windows (`Start-Kobo-WiFi-Server.bat`) & Mac/Linux (`Start-Kobo-WiFi-Server.sh`) Home Wi-Fi Sideload Launchers:**
             - Downloadable standalone into any `Downloads` folder — automatically downloads `KoboArc7Freedom.apk` & `VanillaAndroid4Home.apk`, opens **Windows Defender Firewall** inbound TCP port `8000`/`8080`, filters out virtual/WSL2/VPN adapters to display your real home Wi-Fi `http://192.168.x.x:8000` address, and runs an embedded native `.NET TcpListener` HTTP/1.1 server even if Python is not installed!
          2. **Hardened `tools/serve-over-wifi.py` (`0.0.0.0:8000`) & Static Web Portals (`docs/index.html`, `releases/index.html`):**
             - Full `HTTP/1.1` + `HEAD` + `206 Partial Content` byte-range streaming + query-string safe routing + live ES3 transfer progress bar + `/raw/KoboArc7Freedom.apk` (`application/octet-stream`) fallback button for Kobo Android 4.2 `DownloadManager` + `<1 ms` TLS `ClientHello` fast-reject so Chrome/Edge/Safari HTTPS-First mode falls back to plain `http://` immediately.
          3. **Hardened On-Tablet Wi-Fi File Drive (`Arc7WifiDriveService` — `http://<tablet-ip>:8080`):**
             - Tapping **Tab 5 -> Wi-Fi Drive** now **starts the server immediately** as a persistent Android **Foreground Service** holding `WIFI_MODE_FULL_HIGH_PERF` + `PARTIAL_WAKE_LOCK` (never background-killed or slept with screen off).
             - Binds `0.0.0.0` with `SO_REUSEADDR` and automatic `8080 -> 8088 -> 8888` port fallback, rejects TLS `ClientHello` in `<1 ms`, adds a direct **1-Step Auto-Unlock URL (`http://<ip>:8080/?pin=XXXX`)** + **Disable PIN** toggle, propagates `?pin=` across all links/forms even when browsers block cookies over raw LAN IPs, and auto-restarts on boot / Wi-Fi reconnect.
          4. **50x Faster Local `TLS 1.3` Browser Portal (`native/arc7tls.c` `:8118`):**
             - Buffered 32 KB socket streaming + full query-string URL-encoding on rewritten links.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.6.0 >/dev/null 2>&1; then
            gh release upload v1.6.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.6.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.6.0 — 1-Click Zero-Firewall Wi-Fi Server (:8000), Auto-Start Wi-Fi Drive (:8080) & Web Portal" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.5.0 v1.4.0 v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/Start-Kobo-WiFi-Server.bat \
                releases/Start-Kobo-WiFi-Server.sh \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done

  deploy-pages:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: build-and-verify
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure & Auto-Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Web Installer Portal to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
