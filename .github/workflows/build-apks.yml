name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Generate vector logo, icons, static web portals & build v1.8.2 APKs from source
        run: |
          chmod +x scripts/build-all.sh releases/Backup-Kobo-To-Laptop-ADB.sh
          python3 scripts/generate-icons.py
          ./scripts/build-all.sh

      - name: Run full v1.8.2 Built-In 4-Tier DNS, Live F-Droid Index Download + ZIP Verification, Browser TLS 1.3 & APK verification
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed v1.8.2 APKs, static web portals & 1-click USB/Wi-Fi launchers back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch releases/Upgrade-My-Kobo-To-v1.8.1.apk
          git add \
            docs/index.html \
            docs/.nojekyll \
            docs/logo-banner.png \
            docs/Backup-Kobo-To-Laptop-ADB.bat \
            docs/Backup-Kobo-To-Laptop-ADB.sh \
            docs/Start-Kobo-WiFi-Server.bat \
            docs/Start-Kobo-WiFi-Server.sh \
            releases/index.html \
            releases/logo-banner.png \
            releases/Upgrade-My-Kobo-To-v1.8.2.apk \
            releases/KoboArc7Freedom.apk \
            releases/VanillaAndroid4Home.apk \
            releases/Backup-Kobo-To-Laptop-ADB.bat \
            releases/Backup-Kobo-To-Laptop-ADB.sh \
            releases/Start-Kobo-WiFi-Server.bat \
            releases/Start-Kobo-WiFi-Server.sh \
            releases/SHA256SUMS.txt \
            app/src/main/assets/VanillaAndroid4Home.apk \
            app/src/main/assets/starter-apps/FDroidClassicLegacy.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.8.2 APKs & web installer portals [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built v1.8.2 APKs, 1-Tap Upgrader, USB ADB Backup & Wi-Fi launchers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/Upgrade-My-Kobo-To-v1.8.2.apk
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/Backup-Kobo-To-Laptop-ADB.bat
            releases/Backup-Kobo-To-Laptop-ADB.sh
            releases/Start-Kobo-WiFi-Server.bat
            releases/Start-Kobo-WiFi-Server.sh
            releases/SHA256SUMS.txt

      - name: Upload GitHub Pages web installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish signed v1.8.2 APKs, 1-Tap Root Upgrader & USB ADB / Wi-Fi tools to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.8.2 (`ca.arc7freedom.app` + `Upgrade-My-Kobo-To-v1.8.2.apk`)

          **Real Kobo Arc 7 Hardware Fix (`v1.8.2`) — Fixes Browser `"failing to get IP addresses"` + Fixes F-Droid Classic Repository Index Download:**

          ### HOW TO INSTALL ON YOUR KOBO ARC 7:
          - **Already on `v1.8.1`?** Simply download & install **`KoboArc7Freedom.apk`** directly over top in 1 tap (uses the same permanent release certificate `SHA256: 11:FD:17:ED:...` — zero uninstall or reboot needed!).
          - **Still on `v1.5.0` – `v1.8.0`?** Download & open **`Upgrade-My-Kobo-To-v1.8.2.apk`** (`ca.arc7freedom.upgrader`) once in 1 tap!

          ### What's Fixed in `v1.8.2`:
          1. **Built-In 4-Tier Pure-C Android DNS Engine (`native/arc7tls.c`):** Static `musl` binaries previously relied on `/etc/resolv.conf` (absent on Android 4.2.2, failing against closed `127.0.0.1:53`). `arc7tls` now resolves all hostnames natively via **128-entry RAM TTL Cache (`<0.001 ms`) -> Android `getprop` Wi-Fi DNS + `1.1.1.1`/`8.8.8.8`/`9.9.9.9` UDP `:53` -> TCP `:53` automatic fallback -> TLS 1.3 RFC 8484 DNS-over-HTTPS (`1.1.1.1:443` / `8.8.8.8:443`)**!
          2. **Full F-Droid Classic Fix:** Instant `<0.2 ms` `listen(127.0.0.1:8118)` before CA parsing, detached `oom_score_adj = -1000` low-memory-killer protection while parsing F-Droid's `45 MB` index JSON on 1 GB RAM, automatic daemon hot-swap on APK install (`MY_PACKAGE_REPLACED`), and automatic one-time clean-slate removal of previously poisoned `502` cache files in `eu.bubu1.fdroidclassic.debug`.
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.8.2 >/dev/null 2>&1; then
            gh release edit v1.8.2 --latest --title "Kobo Arc 7 Freedom v1.8.2 — Built-In 4-Tier Android DNS + Working Browser & F-Droid!" --notes-file /tmp/release-notes.md
            gh release upload v1.8.2 \
              releases/Upgrade-My-Kobo-To-v1.8.2.apk \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.8.2 \
              releases/Upgrade-My-Kobo-To-v1.8.2.apk \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/Backup-Kobo-To-Laptop-ADB.bat \
              releases/Backup-Kobo-To-Laptop-ADB.sh \
              releases/Start-Kobo-WiFi-Server.bat \
              releases/Start-Kobo-WiFi-Server.sh \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.8.2 — Built-In 4-Tier Android DNS + Working Browser & F-Droid!" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.8.1 v1.8.0 v1.7.0 v1.6.0 v1.5.0 v1.4.0 v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/Upgrade-My-Kobo-To-v1.8.2.apk \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/Backup-Kobo-To-Laptop-ADB.bat \
                releases/Backup-Kobo-To-Laptop-ADB.sh \
                releases/Start-Kobo-WiFi-Server.bat \
                releases/Start-Kobo-WiFi-Server.sh \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done
