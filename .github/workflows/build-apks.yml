name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Build KoboArc7Freedom.apk & VanillaAndroid4Home.apk from source
        run: ./scripts/build-all.sh

      - name: Run full APK signature, 2026 CA store, live TLS 1.3 & functional test suite
        run: python3 scripts/verify-apks.py

      - name: Upload built APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/SHA256SUMS.txt

      - name: Publish signed APKs to GitHub Releases (v1.1.0 latest + v1.0.0)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.1.0 (`ca.arc7freedom.app`)

          **NEW IN v1.1.0 — 120 Pre-Downloaded 2026 Network Certificates + Modern ARMv7 TLS 1.3 Engine & Android ROM/App Downloader (`Tab 2: CERTS & NET`)!**

          Zero working internet on the tablet is needed before installing `KoboArc7Freedom.apk`:
          - **120 Pre-Downloaded 2026 Mozilla Root CA Certificates (`assets/cacerts/`)** bundled **100% offline** inside the APK in exact Android 4.2 `/system/etc/security/cacerts/<subject_hash_old>.0` format (*Let's Encrypt ISRG Root X1 & X2, Google Trust Services GTS R1–R4, DigiCert Global Root G2/G3, Cloudflare, USERTrust/Sectigo, Amazon Root CAs*, and more).
          - **One-Tap Internet & Certificate Fix (`Tab 2: CERTS & NET`):**
            1. Installs all **120 pre-downloaded 2026 Root CAs** into `/system/etc/security/cacerts/` & Android KeyChain (or installs via Android's non-root Certificate UI even before rooting!).
            2. Automatically quarantines **expired 2013–2023 system CAs** (including expired `DST Root CA X3`, which breaks Let's Encrypt on Android 4.2's OpenSSL 1.0.1 validator even when ISRG Root X1 is added!).
            3. Automatically syncs dead-battery `2013` tablet clocks to atomic UTC via raw IPv4 UDP **NTP** (`162.159.200.1`, `216.239.35.0`) + plain HTTP `Date:` header fallback, and sets clean DNS (`1.1.1.1` / `8.8.8.8`).
          - **Built-In Modern ARMv7 MbedTLS 3.6 (`TLS 1.3` + `TLS 1.2`) Downloader & Local Browser Gateway (`libarc7tls.so`):**
            - Download any Android `.zip` ROM, `recovery.img`, or `.apk` over modern `TLS 1.3` directly in the app (even before rooting!) and jump straight to flashing/installing it, **OR** tap **`Open TLS 1.3 Browser Portal`** (`http://127.0.0.1:8118/`) to search & download from modern websites right inside Kobo Arc 7's stock Browser!
            - Plus **Clean Stock Android 4.2 Jelly Bean Conversion (`Tab 4: ANDROID 4`)** is ALSO already **100% pre-bundled offline** inside `KoboArc7Freedom.apk` (`0 MB` download required!).

          ### Direct APK Downloads (Below under Assets)
          - **`KoboArc7Freedom.apk`** — Full app (`Root` + `120 Pre-Downloaded 2026 Certs & TLS 1.3 Downloader` + `OS Backup/Restore` + `Stock Android 4.2 Converter & ROM Flasher`)
          - **`VanillaAndroid4Home.apk`** — Standalone Clean Stock Android 4.2 Holo Home Launcher (also embedded offline inside `KoboArc7Freedom.apk`)
          - **`SHA256SUMS.txt`** — SHA-256 verification digests
          EOF

          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.1.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.1.0 — Pre-Downloaded 2026 Network Certs, TLS 1.3 Downloader, Root & Stock Android 4.2" \
              --notes-file /tmp/release-notes.md
          fi

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --clobber
          fi
