name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform & Zig + Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow androguard loguru

      - name: Build KoboArc7Freedom.apk & VanillaAndroid4Home.apk from source
        run: ./scripts/build-all.sh

      - name: Run full APK signature, DEX 035, ELF32 ARMv7 & functional test suite
        run: python3 scripts/verify-apks.py

      - name: Upload built APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/SHA256SUMS.txt

      - name: Publish signed APKs to GitHub Release v1.0.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.0.0 (`ca.arc7freedom.app`)

          Ready-to-sideload signed Android 4.2.2 (`API 17` / `minSdk 15`, Dalvik `DEX 035`, `v1 JAR + v2 + v3` signatures, ARMv7 static native binaries) release for the **Kobo Arc 7 (`T647` / `apollojr`, MediaTek MT8125)** with automatic board detection & safety guards for the **Kobo Arc 7HD (`T416`, NVIDIA Tegra 3)**.

          ### Direct APK Downloads (Below under Assets)
          - **`KoboArc7Freedom.apk`** — Complete all-in-one Android app containing:
            1. **On-Device Root & Persistent `su` Installer (`Tab 1: ROOT`)** — Multi-stage Android 4.2 ARMv7 Linux 3.4 root engine (`CVE-2013-6282` + `MT8125` driver elevation + `CVE-2014-3153`), `/system/xbin/su` + `/system/etc/install-recovery.sh` persistence, and live verification.
            2. **Factory OS Partition Backup & Restore (`Tab 2: BACKUP OS`)** — Streaming gzip + SHA-256 verified backups of factory `/system`, `boot`, `recovery`, Wi-Fi/MAC `nvram` (`protect_f` / `protect_s`), `build.prop`, and auto-generated SP Flash Tool `MT8125_Android_scatter.txt` to external microSD (`/storage/sdcard1`) or internal storage, with full checksum verification and restore.
            3. **Normal Stock Android 4 Installer (`Tab 3: ANDROID 4`)** — Includes **both**:
               - **Mode A (Recommended):** One-tap safe conversion to clean Stock Android 4.2 Jelly Bean (installs `VanillaAndroid4Home` Holo launcher & searchable App Drawer, archives Kobo lock-in/Tapestry/dead Setup Wizard to reversible backup, sets `device_provisioned=1` & `user_setup_complete=1` so the Home button & notification shade work properly, and preserves 100% of working MT8125 Wi-Fi, touch, audio, and PowerVR GPU drivers).
               - **Mode B (Advanced):** Custom ROM `.zip` recovery installer (with MT8125 vs Tegra 3 brick guard & `openrecoveryscript` staging) + `recovery.img` / `boot.img` flasher with `ANDROID!` header validation.
            4. **Power Tools (`Tab 4: TOOLS`)** — Instant Kobo Setup Wizard bypass, `/system` RW/RO toggle, system/user APK installer, and Reboot Manager (`Normal` / `Recovery` / `Bootloader`).
          - **`VanillaAndroid4Home.apk`** — Standalone clean Stock Android 4.2 Holo Home Launcher (`ca.arc7freedom.launcher`), also embedded inside `KoboArc7Freedom.apk`.
          - **`SHA256SUMS.txt`** — SHA-256 verification digests.
          EOF

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.0.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "Kobo Arc 7 Freedom v1.0.0 — Root, OS Backup/Restore & Clean Stock Android 4.2" \
              --notes-file /tmp/release-notes.md
          fi
