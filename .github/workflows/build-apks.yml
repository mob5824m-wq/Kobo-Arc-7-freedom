name: Build & Verify Kobo Arc 7 APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 17 (4.2.2) platform, Zig, Certifi & Androguard
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          python3 -m pip install --upgrade pip ziglang pillow certifi androguard loguru

      - name: Build KoboArc7Freedom.apk & VanillaAndroid4Home.apk from source
        run: ./scripts/build-all.sh

      - name: Run full APK signature, 2026 CA store, live TLS 1.3 & functional test suite
        run: python3 scripts/verify-apks.py

      - name: Commit refreshed signed APKs back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/KoboArc7Freedom.apk releases/VanillaAndroid4Home.apk releases/SHA256SUMS.txt app/src/main/assets/VanillaAndroid4Home.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pre-built signed v1.2.0 APKs [skip ci]"
            git push origin HEAD
          fi

      - name: Upload built APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-arc-7-freedom-apks
          path: |
            releases/KoboArc7Freedom.apk
            releases/VanillaAndroid4Home.apk
            releases/SHA256SUMS.txt

      - name: Publish signed APKs to GitHub Releases (v1.2.0 latest + update earlier tags)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Kobo Arc 7 Freedom v1.2.0 (`ca.arc7freedom.app`)

          **Complete Offline-First Root, 120 Pre-Downloaded 2026 Root CAs, Standalone `Arc7 Browser (TLS 1.3)`, OS Partition Backup/Restore, Battery Drain Fix & Clean Stock Android 4.2 Suite!**

          ### Highlights in `v1.2.0`
          - **Standalone `Arc7 Browser (TLS 1.3)` Included Inside the APK (`Arc7BrowserActivity`):**
            - Automatically adds a standalone **`Arc7 Browser (TLS 1.3)`** app icon right to your Android 4 Home Screen & App Drawer (and handles `http://` & `https://` links)!
            - Intercepts every HTML, CSS, JavaScript, and image request through our embedded static ARMv7 `Mbed-TLS 3.6 LTS` (`TLS 1.3 + ChaCha20-Poly1305 + AES-GCM`) engine + all **120 pre-downloaded 2026 Root CA certificates**, plus includes a built-in `.apk` / `.zip` ROM Download Manager!
          - **120 Pre-Downloaded 2026 Mozilla Root CA Certificates (`Tab 2: CERTS & NET`):**
            - 100% offline inside the APK (`ISRG Root X1/X2`, `Google GTS R1–R4`, `DigiCert Global Root G2`, `USERTrust/Sectigo`, `Cloudflare`, `Amazon`), automatic removal of expired 2013–2023 poison CAs (`DST Root CA X3`), raw-IP UDP `NTP` clock sync, and `1.1.1.1` / `8.8.8.8` DNS repair.
          - **Automatic Self-Healing Clock & Network on Reboot (`BootNetworkReceiver`):**
            - If an old Kobo Arc 7 battery runs flat and resets the date back to `Jan 1, 2013`, joining Wi-Fi automatically re-syncs atomic 2026 UTC time via NTP in the background so HTTPS stays unbroken!
          - **Built-In Storage & MicroSD File Manager + Play Services Battery-Drain Fix (`Tab 5: TOOLS`):**
            - Browse `/storage/sdcard1` (MicroSD) & `/sdcard` (Internal) right inside the app, and freeze Google's retired 2013 API-17 Play Services CPU loop to stop crash popups and triple standby battery life!
          - **Zero-Cable Local Home Wi-Fi Sideloader (`python3 tools/serve-over-wifi.py`):**
            - Serves `KoboArc7Freedom.apk` (and any local ROM `.zip`s) over plain `http://<LAN-IP>:8000` so Kobo's stock 2013 Browser can install the app in 10 seconds with zero cables and zero SSL certs!
          EOF

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.2.0 \
              releases/KoboArc7Freedom.apk \
              releases/VanillaAndroid4Home.apk \
              releases/SHA256SUMS.txt \
              --target "${HEAD_COMMIT}" \
              --latest \
              --title "Kobo Arc 7 Freedom v1.2.0 — Built-In TLS 1.3 Browser, 120 Offline 2026 Certs, Root, Backup & Stock Android 4.2" \
              --notes-file /tmp/release-notes.md
          fi

          for TAG in v1.1.0 v1.0.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                releases/KoboArc7Freedom.apk \
                releases/VanillaAndroid4Home.apk \
                releases/SHA256SUMS.txt \
                --clobber
            fi
          done
