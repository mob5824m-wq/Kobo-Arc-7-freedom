apply plugin: "com.android.application"

android {
    namespace "ca.arc7freedom.launcher"
    compileSdkVersion 19

    defaultConfig {
        applicationId "ca.arc7freedom.launcher"
        minSdkVersion 15
        targetSdkVersion 17
        versionCode 55
        versionName "5.5.0"
    }

    // Uses the Android Gradle Plugin's conventional src/main/{AndroidManifest.xml,java,res} layout.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
