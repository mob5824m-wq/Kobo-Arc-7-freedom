apply plugin: "com.android.application"

android {
    namespace "ca.arc7freedom.launcher"
    compileSdkVersion 19

    defaultConfig {
        applicationId "ca.arc7freedom.launcher"
        minSdkVersion 15
        targetSdkVersion 17
        versionCode 42
        versionName "4.2.2-vanilla"
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
