apply plugin: "com.android.application"

android {
    namespace "ca.arc7freedom.upgrader"
    compileSdkVersion 19

    defaultConfig {
        applicationId "ca.arc7freedom.upgrader"
        minSdkVersion 15
        targetSdkVersion 17
        versionCode 269
        versionName "2.6.9"
    }

    sourceSets.main.java.srcDirs += ["${rootProject.projectDir}/shared/java"]

    sourceSets {
        main {
            // Share only the pure-Java in-place payload reader, not the suite's Activities/services.
            java.srcDir "${rootProject.projectDir}/app/src/main/java"
            java.include "ca/arc7freedom/upgrader/**", "ca/arc7freedom/app/BundledApk.java",
                    "ca/arc7freedom/support/**", "ca/arc7freedom/glass/**"
            assets.srcDir "$buildDir/generated/release-assets"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

// Keep the single large payload out of source control duplication while making the Gradle
// module buildable. The reproducible release build still stages the same APK itself.
def stageUpgradePayload = tasks.register("stageUpgradePayload", Copy) {
    from("${rootProject.projectDir}/releases/KoboArc7Freedom.apk")
    into("${buildDir}/generated/release-assets")
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn(stageUpgradePayload)
    }
}
