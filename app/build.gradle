apply plugin: "com.android.application"

android {
    namespace "ca.arc7freedom.app"
    compileSdkVersion 19

    defaultConfig {
        applicationId "ca.arc7freedom.app"
        minSdkVersion 15
        targetSdkVersion 17
        versionCode 253
        versionName "2.5.3"
        ndk {
            abiFilters "armeabi-v7a", "armeabi"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${rootProject.projectDir}/build/native"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
